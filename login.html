<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in - Nutritional Insights Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.0.0/dist/tailwind.min.css" rel="stylesheet">
    <style>
        .status-banner {
            display: none;
            padding: 0.6rem 1rem;
            border-radius: 0.5rem;
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">

    <div class="bg-white shadow-lg rounded-lg p-8 w-full max-w-sm">
        <h1 class="text-2xl font-semibold mb-1 text-center">Nutritional Insights</h1>
        <p class="text-sm text-gray-600 text-center mb-6">Log in to view the dashboard</p>

        <div id="status-banner" class="status-banner"></div>

        <form id="auth-form" class="space-y-4">
            <div id="name-field">
                <label for="name" class="block text-sm text-gray-600 mb-1">Name</label>
                <input id="name" type="text" class="w-full p-2 border rounded" autocomplete="name" />
            </div>

            <div>
                <label for="email" class="block text-sm text-gray-600 mb-1">Email</label>
                <input id="email" type="email" required class="w-full p-2 border rounded" autocomplete="email" />
            </div>

            <div>
                <label for="password" class="block text-sm text-gray-600 mb-1">Password</label>
                <input id="password" type="password" required minlength="8" class="w-full p-2 border rounded" autocomplete="current-password" />
            </div>

            <button id="submit-btn" type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">
                Log in
            </button>
        </form>

        <p class="text-sm text-center mt-4">
            <span id="toggle-prompt">Don't have an account?</span>
            <button id="toggle-mode" type="button" class="text-blue-600 hover:underline ml-1">Register</button>
        </p>

        <div class="flex items-center gap-3 my-5">
            <div class="flex-1 h-px bg-gray-200"></div>
            <span class="text-xs text-gray-400">OR</span>
            <div class="flex-1 h-px bg-gray-200"></div>
        </div>

        <button id="github-login-btn" type="button"
            class="w-full bg-gray-900 text-white py-2 rounded hover:bg-gray-800 flex items-center justify-center gap-2">
            Continue with GitHub
        </button>
    </div>

    <script src="auth.js"></script>
    <script src="login.js"></script>
</body>
</html>
